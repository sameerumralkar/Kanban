name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce project constraints
        run: |
          for f in index.html v2/index.html; do
            if grep -nE 'localStorage|sessionStorage|indexedDB|document\.cookie|alert\(|confirm\(|!important|<link|src="http' "$f"; then
              echo "::error::$f violates a project constraint (see CLAUDE.md)"
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax check
        run: |
          for f in index.html v2/index.html; do
            awk '/<script>/{f=1;next}/<\/script>/{f=0}f' "$f" > "$RUNNER_TEMP/app.js"
            node --check "$RUNNER_TEMP/app.js"
          done

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to GitHub Pages
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site files
        run: mkdir -p _site/v2 && cp index.html _site/ && cp v2/index.html _site/v2/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
